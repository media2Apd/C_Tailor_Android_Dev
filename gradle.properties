# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE UI will override any settings in this file.
# Specifies the JVM arguments used for the Gradle Daemon.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
# AndroidX package structure
android.useAndroidX=true
# Enable non-transitive R classes for better build performance
android.nonTransitiveRClass=true
